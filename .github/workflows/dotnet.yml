name: .NET

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore ogpmcpsharp.slnx
      - run: dotnet build ogpmcpsharp.slnx --no-restore
      - run: dotnet test ogpmcpsharp.slnx --no-build --no-restore
